# ────────────────────────────────────────────────
# TEMPLATE — copy this file, rename the copy to "server-secrets.cfg"
# (same folder), then fill in your real values below.
#
# server-secrets.cfg is listed in .gitignore, so it will NEVER be
# uploaded to GitHub. You only need to do this once — after that,
# downloading updates from GitHub will never touch or overwrite it.
# ────────────────────────────────────────────────

# Get this from https://keymaster.fivem.net/ (free, instant, no approval needed)
set sv_licenseKey "PASTE_YOUR_REAL_LICENSE_KEY_HERE"

# Must match the database name/user/password you created when setting up MariaDB
set mysql_connection_string "mysql://fivem_user:PASTE_YOUR_REAL_DB_PASSWORD_HERE@localhost/fivem_db?charset=utf8mb4"
